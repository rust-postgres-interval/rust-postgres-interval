[package]
name = "pg_interval"
version = "0.6.0"
edition = "2024"
authors = ["Ryan Piper <piper.ryan235@gmail.com>", "Ning Sun <n@sunng.info>"]
license = "MIT"
description = "A native PostgreSQL interval type"
repository = "https://github.com/piperRyan/rust-postgres-interval"
readme = "README.md"
keywords = ["database", "postgres", "postgresql", "sql", "interval"]
include = ["src/*", "Cargo.toml", "LICENSE", "README.md"]
categories = ["date-and-time"]

[features]
default = ["postgres", "chrono"]
postgres = ["postgres-types", "dep:bytes"]
# `Interval::from_duration` from chrono's `Duration`.
chrono = ["dep:chrono"]

[dependencies]
chrono = { version = "^0.4", optional = true }
bytes = { version = "^1", optional = true }
postgres-types = { version = "^0.2", optional = true }
